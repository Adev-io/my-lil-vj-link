name: fl

on:
  push:
    branches: [main]
    tags: ['fl-v*']
    paths:
      - 'fl/**'
      - 'core/**'
      - '.github/workflows/fl.yml'
  pull_request:
    paths:
      - 'fl/**'
      - 'core/**'
      - '.github/workflows/fl.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: fl/build/_deps
          key: deps-${{ hashFiles('fl/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S fl -B fl/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build fl/build

      - name: Smoke test
        run: ctest --test-dir fl/build --output-on-failure

      - name: Tag matches CMake version
        if: startsWith(github.ref, 'refs/tags/fl-v')
        shell: bash
        run: grep -q "VERSION ${GITHUB_REF_NAME#fl-v})" fl/CMakeLists.txt

      - name: Package
        if: startsWith(github.ref, 'refs/tags/fl-v')
        shell: pwsh
        run: |
          $rel = "fl/build/MyLilVJLink_artefacts/Release"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse "$rel/VST3/My lil VJ Link.vst3" pkg/
          Copy-Item fl/LICENSE pkg/LICENSE.txt
          Copy-Item fl/INSTALL.txt pkg/INSTALL.txt
          Copy-Item docs/PROTOCOL.md pkg/PROTOCOL.md
          Compress-Archive -Path pkg/* -DestinationPath "My-lil-VJ-Link-${env:GITHUB_REF_NAME}-windows-x64.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/fl-v')
        uses: softprops/action-gh-release@v2
        with:
          files: My-lil-VJ-Link-*.zip
          generate_release_notes: true
